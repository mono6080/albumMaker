upstream album_maker {
    server unix:/album_maker_socket/app.sock;
}

log_format album_maker_timing
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    '"$http_x_forwarded_for" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time';

server {
    listen 80;
    listen 443 ssl;
    server_name  album.derni.com.tw;
    charset      utf-8;
    client_max_body_size 50M;
    access_log   /var/log/nginx/access.log album_maker_timing;

    ssl_certificate     /etc/letsencrypt/live/derni.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/derni.com.tw/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/derni.com.tw/chain.pem;

    location / {
        proxy_pass         http://album_maker;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
