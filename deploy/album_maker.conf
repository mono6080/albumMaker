upstream album_maker {
    server unix:/album_maker_socket/app.sock;
}

log_format album_maker_timing
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    '"$http_x_forwarded_for" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time';

server {
    listen 80;
    # http2：一班 30 張縮圖/預覽不再受 HTTP/1.1 每站 6 條連線的瀑布排隊限制
    listen 443 ssl;
    http2 on;
    server_name  album.derni.com.tw;
    charset      utf-8;
    client_max_body_size 50M;
    access_log   /var/log/nginx/access.log album_maker_timing;

    # 文字資產壓縮（JS/CSS/JSON）：956KB 的前端 bundle 壓後約 288KB。
    # 平常由 Cloudflare 邊緣代壓，這裡是灰雲/直連時的防線
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    ssl_certificate     /etc/letsencrypt/live/derni.com.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/derni.com.tw/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/derni.com.tw/chain.pem;

    location / {
        proxy_pass         http://album_maker;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 大 ZIP（全班相冊可達數百 MB）串流下載需要比 120s 更長的視窗；
        # proxy_buffering 維持預設 on——nginx 邊收邊送並代替單 worker 的
        # uvicorn 憋慢速手機客戶端
        proxy_read_timeout 600s;
    }
}
