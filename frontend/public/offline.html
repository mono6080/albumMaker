<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>相本製作 — 離線</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      color: #111827;
      padding: 1.5rem;
      text-align: center;
    }
    .icon-wrap {
      width: 4rem; height: 4rem;
      background: #e0e7ff;
      border-radius: 1rem;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
    }
    svg { width: 2rem; height: 2rem; color: #818cf8; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { font-size: 0.875rem; color: #6b7280; line-height: 1.6; margin-bottom: 2rem; }
    button {
      background: #4f46e5; color: #fff;
      border: none; cursor: pointer;
      padding: 0.625rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.875rem; font-weight: 500;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
    </svg>
  </div>
  <h1>目前沒有網路連線</h1>
  <p>相本製作需要連線才能使用，<br>請確認網路後重新整理。</p>
  <button onclick="location.reload()">重新整理</button>
  <script>
    // 新版 Service Worker 接管後自動重新載入，解決舊 SW 攔截路由顯示此頁的問題
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        location.reload();
      });
    }
  </script>
</body>
</html>
