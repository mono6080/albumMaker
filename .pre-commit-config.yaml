repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml", "backend", "tests"]
        additional_dependencies:
          - fastapi
          - sqlalchemy
          - pydantic
          - python-jose
          - bcrypt
          - slowapi
          - pillow
          - httpx
          - python-multipart
        pass_filenames: false
        files: ^(backend|tests)/
