services:
  app:
    build:
      context: .
      # 部署帶入 git SHA（見 deployment.md）；commit 變更即強制重編前端
      args:
        APP_BUILD_ID: ${APP_BUILD_ID:-dev}
    volumes:
      - uploads:/app/uploads
      - db:/app/db
      - backups:/app/backups
      - production_album_maker_socket:/album_maker_socket
    env_file:
      - .env
    environment:
      PRODUCTION: ${PRODUCTION:-1}
      PHOTO_UPLOAD_CONCURRENCY: ${PHOTO_UPLOAD_CONCURRENCY:-2}
      # 排隊逾時需大於單一重任務時間，否則兩人同用時排隊者必 503（見 request_limiter.py）
      HEAVY_REQUEST_QUEUE_TIMEOUT_SECONDS: ${HEAVY_REQUEST_QUEUE_TIMEOUT_SECONDS:-10}
      PREVIEW_RENDER_CONCURRENCY: ${PREVIEW_RENDER_CONCURRENCY:-4}
    networks:
      - nginx_net
    restart: unless-stopped
    command: >
      python -m uvicorn main:app
      --uds /album_maker_socket/app.sock
      --forwarded-allow-ips='*'

networks:
  nginx_net:
    external: true

volumes:
  uploads:
  db:
  backups:
  production_album_maker_socket:
