name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-secret-do-not-use
      ALBUM_MAKER_TEST_TMPDIR: .tmp/pytest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          # 鎖定版本避免工具升版無預警讓 CI 轉紅（2026-05 mypy 升版曾造成一個月紅燈）
          python -m pip install pytest==9.0.3 httpx ruff==0.15.12 mypy==1.20.2

      - name: Ruff
        run: python -m ruff check backend tests

      - name: Mypy
        run: python -m mypy backend tests

      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: e2e-secret-do-not-use
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for E2E backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies for E2E
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../backend/requirements.txt

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: ESLint
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Render parity
        run: npm run test:render-parity

      - name: Browser E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build
